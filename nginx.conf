# Static file serving for the exported site. No proxying and no upstreams: the
# site talks to nothing, which is most of the reason it is built this way.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # For the container healthcheck and any orchestrator probe. Kept out of the
    # access log so a liveness probe every five seconds does not become the
    # majority of the log volume.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # next.config.ts sets trailingSlash, so /drivers/ is a directory holding
    # index.html. This makes /drivers work too rather than 404ing on a link
    # somebody typed by hand or an old bookmark.
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    # Hashed build assets are immutable by construction — the hash changes when
    # the content does — so they can be cached for a year.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML is not. A page cached for a year is a price change nobody sees.
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # The site loads no third-party script, frame or stylesheet, so the policy
    # can be strict enough to actually mean something. next/font inlines its
    # faces, which is why font-src needs no external host.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
